<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14203f" />
  <title>Offline — Anchor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; text-align: center;
      padding: 32px 24px;
      font-family: 'DM Sans', -apple-system, sans-serif;
      color: #fff;
      background:
        radial-gradient(120% 60% at 100% 0%, rgba(63,125,78,.45), transparent 60%),
        radial-gradient(100% 60% at 0% 100%, rgba(201,164,73,.25), transparent 60%),
        linear-gradient(170deg, #1d2c56, #0b1430);
    }
    .mark { display: block; margin: 0 auto 22px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.05; margin-bottom: 12px; }
    p { color: rgba(255,255,255,.7); line-height: 1.6; max-width: 320px; margin: 0 auto 30px; font-size: 15px; }
    blockquote { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; color: rgba(255,255,255,.85); max-width: 320px; margin: 0 auto 32px; }
    a {
      display: inline-block; padding: 14px 32px; border-radius: 999px;
      background: linear-gradient(140deg, #d9b866, #b8913a); color: #fff;
      font-weight: 700; font-size: 15px; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="icons/icon.svg" alt="" width="88" height="88">
    <h1>You’re offline</h1>
    <p>Anchor needs a connection the first time it loads. Once it has, your prayers work offline too.</p>
    <blockquote>“Be still, and know that I am God.” — Psalm 46:10</blockquote>
    <a href="./">Try again</a>
  </main>
</body>
</html>
