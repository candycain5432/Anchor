<!-- Testing only: ?today=2026-12-13 makes the app act as if it's that date (Advent days, Christmas, liturgical day).
     Works on localhost and home-network addresses, never on the live site. It sticks for this tab; ?today=off clears it. -->
<script>
  (function () {
    if (!/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)|\.local$/.test(location.hostname)) return;
    try {
      var m = /[?&]today=([^&]+)/.exec(location.search);
      if (m) m[1] === 'off' ? sessionStorage.removeItem('anchor:today') : sessionStorage.setItem('anchor:today', m[1]);
      var d = sessionStorage.getItem('anchor:today');
      if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var R = Date, now = new R(), target = new R(d + 'T00:00:00');
      target.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
      var off = target - now;
      window.Date = class extends R { constructor(...a) { a.length ? super(...a) : super(R.now() + off); } static now() { return R.now() + off; } };
      document.addEventListener('DOMContentLoaded', function () {
        var b = document.createElement('div');
        b.textContent = 'Test date: ' + new Date().toDateString() + ' · ?today=off to stop';
        b.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 4px);transform:translateX(-50%);z-index:999;padding:4px 10px;border-radius:999px;background:#b03a43;color:#fff;font:600 11px/1.4 system-ui,sans-serif;pointer-events:none;white-space:nowrap';
        document.body.append(b);
      });
    } catch (e) {}
  })();
</script>

<!-- Apply saved theme before first paint (no flash) -->
<script>
  (function () {
    try {
      var g = function (k) { var v = localStorage.getItem('anchor:' + k); return v ? JSON.parse(v) : null; };
      var r = document.documentElement;
      var legacyDark = localStorage.getItem('darkMode');
      r.dataset.theme = g('theme') || (legacyDark === 'true' ? 'dark' : 'auto');
      r.dataset.size = g('size') || 'm';
      r.dataset.lit = g('lastLit') || 'green';
    } catch (e) {}
  })();
</script>
