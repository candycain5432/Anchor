<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14203f" />
  <meta name="robots" content="noindex" />
  <title>Shut down — Anchor</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; text-align: center;
      padding: 32px 24px;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      background:
        radial-gradient(120% 60% at 100% 0%, rgba(63,125,78,.45), transparent 60%),
        radial-gradient(100% 60% at 0% 100%, rgba(201,164,73,.25), transparent 60%),
        linear-gradient(170deg, #1d2c56, #0b1430);
    }
    .mark { display: block; margin: 0 auto 22px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
    .eyebrow {
      font-family: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: #d9b866; margin-bottom: 14px;
    }
    h1 { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.05; margin-bottom: 14px; }
    p { color: rgba(255,255,255,.7); line-height: 1.6; max-width: 340px; margin: 0 auto 28px; font-size: 15px; }
    .rule { width: 56px; height: 1px; margin: 0 auto 26px; background: linear-gradient(90deg, transparent, #d9b866, transparent); }
    blockquote { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; color: rgba(255,255,255,.85); max-width: 320px; margin: 0 auto 32px; }
    .contact { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 0; }
    .contact a { color: #d9b866; text-decoration: none; border-bottom: 1px solid rgba(217,184,102,.4); }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="icons/icon.svg" alt="" width="88" height="88">
    <div class="eyebrow">Anchor</div>
    <h1>This page has been shut down</h1>
    <p>Anchor is offline for the foreseeable future. Thank you for praying with us.</p>
    <div class="rule"></div>
    <blockquote>“Be still, and know that I am God.” — Psalm 46:10</blockquote>
    <p class="contact">Questions? <a href="mailto:contact@williamcain.net">contact@williamcain.net</a></p>
  </main>
</body>
</html>
